name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff2a6d&color_dots=#ebedf0,#a8f4fa,#05d9e8,#0aa3b0,#066a73
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2a6d&color_dots=#161b22,#0b4f57,#05a3b0,#05d9e8,#a8f4fa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
